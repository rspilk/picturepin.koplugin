name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -oP 'PICTUREPIN_VERSION\s*=\s*"\K[^"]+' main.lua)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        run: |
          mkdir -p dist/picturepin.koplugin
          cp _meta.lua main.lua pannableimage.lua pinicon.lua pinnedimagepanel.lua dist/picturepin.koplugin/
          cp -r icons dist/picturepin.koplugin/
          cd dist
          zip -r picturepin.koplugin.zip picturepin.koplugin

      # ncipollo/release-action's "commit" input only tags a *new* tag --
      # since "latest" already exists from the very first run, every
      # later run was updating the release's body/assets in place but
      # never actually moving the tag itself, leaving it pointing at
      # whatever commit first created it. Force it to this commit first.
      - name: Move "latest" tag to this commit
        run: |
          git tag -f latest
          git push origin -f latest

      - name: Publish "latest" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest build (v${{ steps.version.outputs.version }})
          body: "PicturePin v${{ steps.version.outputs.version }}, auto-built from ${{ github.sha }}. Extract so the `picturepin.koplugin` folder lands directly inside KOReader's `plugins/` directory."
          artifacts: dist/picturepin.koplugin.zip
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
